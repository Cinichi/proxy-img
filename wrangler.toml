name = "proxy-img"
main = "src/index.js"
compatibility_date = "2025-01-10"

# Worker configuration
workers_dev = true

# KV Namespace for stats (optional - create with: wrangler kv:namespace create "STATS")
# Uncomment after creating KV namespace:
# [[kv_namespaces]]
# binding = "STATS"
# id = "YOUR_KV_NAMESPACE_ID"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Limits
[limits]
cpu_ms = 50

# Routes (uncomment and configure if using custom domain)
# routes = [
#   { pattern = "img.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Environment variables (optional)
# [vars]
# ENVIRONMENT = "production"
